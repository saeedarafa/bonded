</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["bright","glow","flicker","ember","duo","spark"],"default":"bright"},"size":{"editor":"int","min":16,"max":400,"default":160},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood ?? 'bright';
    const size = Number(this.props.size ?? 160);
    return {
      size: size,
      px: size + 'px',
      isBright: mood === 'bright',
      isGlow: mood === 'glow',
      isFlicker: mood === 'flicker',
      isEmber: mood === 'ember',
      isDuo: mood === 'duo',
      isSpark: mood === 'spark'
    };
  }
}
</script>
</body>
</html>
