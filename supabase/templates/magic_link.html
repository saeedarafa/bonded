<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in to Bonded</title>
  </head>
  <body>
    <h1>Sign in to Bonded</h1>
    <p>Tap the link below to sign in:</p>
    <p><a href="{{ .ConfirmationURL }}">Sign in to Bonded</a></p>
    <p>Or enter this six-digit code in the Bonded app:</p>
    <p><strong>{{ .Token }}</strong></p>
    <p>Use either the link or the code, not both. If you did not request this email, you can ignore it.</p>
  </body>
</html>
