<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Confirm your email for Bonded</title>
  </head>
  <body>
    <h1>Confirm your email for Bonded</h1>
    <p>Tap the link below to confirm your email and sign in:</p>
    <p><a href="{{ .ConfirmationURL }}">Confirm email and sign in</a></p>
    <p>Or enter this six-digit code in the Bonded app:</p>
    <p><strong>{{ .Token }}</strong></p>
    <p>Use either the link or the code, not both. If you did not request this email, you can ignore it.</p>
  </body>
</html>
