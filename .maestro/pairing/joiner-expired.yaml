# QA-04a · screen 56 (invite expired) on J3 · one device (joiner, signed out) · scenario invite-expired
# Maya's invite 4827 expired an hour ago. Typing it shows the expired state (no digits input, ask for
# a new code) with "Ask for a new code" (56-ask) and "Enter a different code" (join-code-retry), which
# brings the digits back (MOB-34).
appId: com.trybonded.app
name: Pairing · 56 invite expired
tags:
  - pairing
  - joiner-errors
  - single-device
---
- runFlow: ../subflows/launch-signed-out.yaml
- tapOn:
    id: 01-code
- extendedWaitUntil:
    visible:
      id: J3-screen
    timeout: 10000
- tapOn:
    id: join-code-input
- inputText: '4827'
- runFlow: ../subflows/tap-away.yaml
- extendedWaitUntil:
    visible:
      id: join-code-retry
    timeout: 15000
- assertNotVisible:
    id: join-code-input # 56 hides the digits; J9 keeps them
- assertNotVisible:
    id: join-code-found
# Board 56 (MOB-34, #37): "Ask for a new code" and "Enter a different code"; no "start my own" here.
- assertVisible:
    id: 56-expired
- assertVisible:
    id: 56-ask
- assertNotVisible:
    id: join-code-own
- tapOn:
    id: join-code-retry
- extendedWaitUntil:
    visible:
      id: join-code-input
    timeout: 10000
- assertNotVisible:
    id: 56-expired
