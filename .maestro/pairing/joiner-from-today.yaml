# QA-12 · D37 (MOB-33b) · screens Today, 12, 13 · device B (Lea: signed up without a code, own space
# lea_solo) · scenario solo-invite-pending. Lea's partner Maya already sent her a code (4827): from her
# own Today she taps "Join my partner instead", types it on 12, confirms that her space is archived,
# waits for Maya's yes (D02, pending) and lands on 13. The run script checks lea_solo is ended (archive,
# BE-25) and Lea is in maya_sam.
# Param CODE (default the seeded 4827). Pair: qa/e2e/run-pairing.ts from-today (device A runs
# inviter-waits.yaml with EXPECT_APPROVAL=true)
appId: app.bonded.mobile
name: Pairing · solo account joins a partner by code from Today (Today, 12, 13) [D37]
tags:
  - pairing
  - two-device
  - device-b
  - d37
  - d02-typed-code
env:
  CODE: '4827'
---
- runFlow:
    file: ../subflows/sign-in-persona.yaml
    env:
      EMAIL: lea@bonded.test
- extendedWaitUntil:
    visible:
      id: today-join-partner
    timeout: 20000
- tapOn:
    id: today-join-partner
- extendedWaitUntil:
    visible:
      id: 12-screen
    timeout: 15000
- tapOn:
    id: join-code-input
- inputText: ${CODE}
# No tap-away: it would cancel the D37 sheet (REL-03c); 12 puts the number pad away itself.
- runFlow: ../subflows/confirm-join-archive.yaml
- runFlow: ../subflows/after-typed-code.yaml
