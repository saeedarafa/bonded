# QA-04a / QA-12 · screens J2, J4, J5, 13 · device B (joiner Sam, no account yet) · scenario
# solo-invite-pending. The invite link with a valid token opens J2 first (MOB-40): the personal welcome
# with Maya's name (invite-preview), no code to type and no J3. "Join" goes to J4 (Sam signs up with an
# email code), J5 saves his name and joins at once (D02: a token link skips the inviter's approval).
# Param START: cold (default; the link launches the app) | warm (the app is already open on 01).
# Pair: qa/e2e/run-pairing.ts link | link-warm (device A runs inviter-waits.yaml)
appId: app.bonded.mobile
name: Pairing · joiner by link with token (J2, J4, J5, 13)
tags:
  - pairing
  - two-device
  - device-b
  - mob-40
env:
  INVITE_LINK: bonded://j/BND4827?t=dev-seed-token-4827
  START: cold
---
- runFlow:
    when:
      true: ${START === 'warm'}
    commands:
      - runFlow: ../subflows/launch-signed-out.yaml
- runFlow:
    when:
      true: ${START !== 'warm'}
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
      - stopApp
# The link opens app/j/[code].tsx, which keeps code + token in memory and redirects to J2.
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: '${INVITE_LINK}'
- extendedWaitUntil:
    visible:
      id: J2-inviter
    timeout: 20000
- assertVisible:
    id: J2-screen
- assertNotVisible:
    id: J3-screen
- assertNotVisible:
    id: J2-error
- assertVisible:
    id: J2-no
- tapOn:
    id: J2-join
- runFlow:
    file: ../subflows/sign-in-email.yaml
    env:
      SCREEN: J4
      EMAIL: sam@bonded.test
- extendedWaitUntil:
    visible:
      id: J5-screen
    timeout: 15000
- tapOn:
    id: J5-name
- inputText: Sam
- runFlow: ../subflows/hide-keyboard.yaml
- assertVisible:
    id: J5-pair
- tapOn:
    id: J5-join
# Token link: pairs at once, no D02 approval step.
- extendedWaitUntil:
    visible:
      id: 13-screen
    timeout: 20000
- assertNotVisible:
    id: J5-error
- tapOn:
    id: 13-continue
- assertNotVisible:
    id: 13-screen
