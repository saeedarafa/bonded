# QA-04a · screens 12, 13 · device B (joiner Lea, signed in, solo couple: D04 solo joiner)
# scenario solo-invite-pending · A signed-in person types the code on 12 ("Join with code") and
# Lea has her own space (lea_solo), so 12 asks first (D37, 12-confirm: her space is archived), then the
# typed code is pending until Maya approves (D02, ../subflows/after-typed-code.yaml; device A runs
# inviter-waits.yaml with EXPECT_APPROVAL=true).
# Param CODE (default the seeded 4827).
# Pair: qa/e2e/run-pairing.ts signed-in (device A runs inviter-waits.yaml)
appId: com.hellobonded.app
name: Pairing · signed-in joiner types a code (12, 13) [D02]
tags:
  - pairing
  - two-device
  - device-b
  - d02-typed-code
env:
  CODE: "${typeof CODE !== 'undefined' ? CODE : '4827'}"
---
- runFlow:
    file: ../subflows/sign-in-persona.yaml
    env:
      EMAIL: lea@bonded.test
# Deep link to 12 (joiner-from-today.yaml covers the in-app entry from Today).
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: bonded://join
- extendedWaitUntil:
    visible:
      id: 12-screen
    timeout: 15000
- tapOn:
    id: join-code-input
- inputText: ${CODE}
# No tap-away: it would cancel the D37 sheet (REL-03c); 12 puts the number pad away itself.
- runFlow: ../subflows/confirm-join-archive.yaml # D37
- runFlow: ../subflows/after-typed-code.yaml # D02
