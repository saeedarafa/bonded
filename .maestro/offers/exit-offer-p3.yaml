# QA-48b · D57 (1) (BE-59, MOB-76) · screens P3, exit offer sheet, 17, 08 · one device · signed out
# (fresh install). The person's first × on the soft trial paywall P3 opens the one-time exit offer
# sheet instead of 17: "N% off your first year" on Yearly, the store's regular price struck through
# and the offer price (both from the RevenueCat `exit30` offering; the % is computed from them, so
# the flow only checks the shape, never a number). "No thanks, continue free" closes the sheet and
# goes on to 08 on the free plan: never blocked or delayed. Before sign-in the phone remembers that
# the sheet showed (D50: no session yet), so the second × on P3 opens 17 as before D57.
# Needs: a build with a RevenueCat sandbox key, the `exit30` offering (yearly_exit30 with a paid
# 1-year intro price) live in the sandbox, and a sandbox store account that is still intro-eligible
# in the subscription group (else the store gate says no and the first × already shows 17: the flow
# then fails at exit-offer-sheet, which is the right signal for a misconfigured test account).
# No purchase is made. Run: maestro test .maestro/offers/exit-offer-p3.yaml --device <id>
appId: com.hellobonded.app
name: Offers · P3 first × opens the exit offer sheet, then 17 (P3, exit offer, 17, 08) [D57]
tags:
  - offers
  - purchases
  - one-device
  - d57
---
- runFlow: ../subflows/launch-signed-out.yaml
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: bonded://plan/trial
- extendedWaitUntil:
    visible:
      id: P3-buy
    timeout: 20000
# First ×: the exit offer sheet, not 17.
- tapOn:
    id: P3-close
- extendedWaitUntil:
    visible:
      id: exit-offer-sheet
    timeout: 15000
- assertNotVisible:
    id: 17-sheet
- assertVisible:
    id: exit-offer-title
    text: '[0-9]+% off your first year'
- assertVisible:
    id: exit-offer-price-offer
- assertVisible:
    id: exit-offer-price-was
- assertVisible:
    id: exit-offer-take
    text: 'Take [0-9]+% off'
- assertVisible:
    id: exit-offer-no
    text: 'No thanks, continue free'
- assertVisible:
    id: exit-offer-close
- takeScreenshot: qa48b-p3-exit-offer
# "No thanks, continue free": the sheet closes and P3 goes on to 08 (free plan), no 17.
- tapOn:
    id: exit-offer-no
- extendedWaitUntil:
    visible:
      id: 08-screen
    timeout: 10000
- assertNotVisible:
    id: exit-offer-sheet
- assertNotVisible:
    id: 17-sheet
# Second × (P3 again on the same phone): 17, never the offer again.
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: bonded://plan/trial
- extendedWaitUntil:
    visible:
      id: P3-buy
    timeout: 20000
- tapOn:
    id: P3-close
- extendedWaitUntil:
    visible:
      id: 17-sheet
    timeout: 15000
- assertNotVisible:
    id: exit-offer-sheet
- takeScreenshot: qa48b-p3-second-close-17
- tapOn:
    id: 17-leave
- extendedWaitUntil:
    visible:
      id: 08-screen
    timeout: 10000
