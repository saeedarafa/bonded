# QA-48b · D57 (1) (BE-59, MOB-76) · screens 16, exit offer sheet, 17 · one device (Maya) · scenario
# free-couple (maya_sam on the free plan, Maya never subscribed). Signed in, the first × on paywall
# 16 asks the server `open_exit_offer('paywall_close')` (once per person, ever) and the store
# (`exit30` intro eligibility); both say yes, so the exit offer sheet shows instead of 17: "N% off
# your first year", struck regular price and offer price from the store (no numbers checked). "No
# thanks, continue free" closes it and leaves 16 (never blocked). The server has now recorded the
# offer, so the second × on 16 opens 17 and never the sheet again.
# Needs: a build with a RevenueCat sandbox key, the `exit30` offering live in the sandbox, an
# intro-eligible sandbox store account, and a fresh database for Maya (`supabase db reset` + seed:
# private.exit_offers has no row for her; a second run without a reset sees 17 on the first × by
# design). The couple's day-3 gift must not be live (the server refuses with gift_live then).
# No purchase is made. Run: maestro test .maestro/offers/exit-offer-16.yaml --device <id>
appId: com.hellobonded.app
name: Offers · 16 first × opens the exit offer sheet, second × opens 17 (16, exit offer, 17) [D57]
tags:
  - offers
  - purchases
  - one-device
  - d57
---
- runFlow:
    file: ../subflows/sign-in-persona.yaml
    env:
      EMAIL: maya@bonded.test
- extendedWaitUntil:
    visible:
      id: tab-history
    timeout: 20000
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: bonded://paywall
- extendedWaitUntil:
    visible:
      id: 16-buy
    timeout: 20000
# First ×: the exit offer sheet, not 17.
- tapOn:
    id: 16-close
- extendedWaitUntil:
    visible:
      id: exit-offer-sheet
    timeout: 15000
- assertNotVisible:
    id: 17-sheet
- assertVisible:
    id: exit-offer-title
    text: '[0-9]+% off your first year'
- assertVisible:
    id: exit-offer-price-offer
- assertVisible:
    id: exit-offer-price-was
- assertVisible:
    id: exit-offer-take
    text: 'Take [0-9]+% off'
- assertVisible:
    id: exit-offer-close
- takeScreenshot: qa48b-16-exit-offer
# "No thanks, continue free": the sheet closes and 16 goes away (back, or Today), no 17.
- tapOn:
    id: exit-offer-no
    text: 'No thanks, continue free'
- extendedWaitUntil:
    notVisible:
      id: 16-buy
    timeout: 10000
- assertNotVisible:
    id: exit-offer-sheet
- assertNotVisible:
    id: 17-sheet
# Second × on 16: the server says shown_before, so 17 as before D57.
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: bonded://paywall
- extendedWaitUntil:
    visible:
      id: 16-buy
    timeout: 20000
- tapOn:
    id: 16-close
- extendedWaitUntil:
    visible:
      id: 17-sheet
    timeout: 15000
- assertNotVisible:
    id: exit-offer-sheet
- takeScreenshot: qa48b-16-second-close-17
- tapOn:
    id: 17-leave
