# QA-52 · D61 (1) (BE-62, MOB-84) · screens P3, 17, 08 · one device · signed out (fresh install).
# D61 retired the D57 exit offer on paywall close: × on the soft trial paywall P3 behaves as before
# D57 (the 17 "Continue with free" sheet, or straight on, then 08 on the free plan). The exit offer
# sheet never shows, on the first × or any later one, and there is no P3 device flag any more.
# Replaces QA-48b's exit-offer-p3.yaml. Fails on a build before MOB-84 (it still shows the sheet).
# Needs: a build with a RevenueCat key (Test Store `test_…` or sandbox) so P3 shows its plans and ×.
# No purchase is made. Run: npm --prefix qa/e2e run offers -- close-p3 --a <device> --rc
appId: com.hellobonded.app
name: Offers · P3 × never opens an exit offer (P3, 17, 08) [D61]
tags:
  - offers
  - purchases
  - one-device
  - d61
---
- runFlow: ../subflows/launch-signed-out.yaml
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: bonded://plan/trial
- extendedWaitUntil:
    visible:
      id: P3-buy
    timeout: 20000
# First ×: no exit offer sheet; 17 (or P3 closing on its own) and then 08.
- tapOn:
    id: P3-close
- extendedWaitUntil:
    visible:
      id: 17-sheet
    timeout: 8000
    optional: true
- assertNotVisible:
    id: exit-offer-sheet
- takeScreenshot: qa52-p3-close-1
- runFlow:
    when:
      visible:
        id: 17-leave
    commands:
      - tapOn:
          id: 17-leave
- extendedWaitUntil:
    visible:
      id: 08-screen
    timeout: 10000
- assertNotVisible:
    id: exit-offer-sheet
# Second × (P3 again on the same phone): still no exit offer.
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: bonded://plan/trial
- extendedWaitUntil:
    visible:
      id: P3-buy
    timeout: 20000
- tapOn:
    id: P3-close
- extendedWaitUntil:
    visible:
      id: 17-sheet
    timeout: 8000
    optional: true
- assertNotVisible:
    id: exit-offer-sheet
- takeScreenshot: qa52-p3-close-2
- runFlow:
    when:
      visible:
        id: 17-leave
    commands:
      - tapOn:
          id: 17-leave
- extendedWaitUntil:
    visible:
      id: 08-screen
    timeout: 10000
