# QA-22 · screens 32, 33, 19, 30, 20, 21 · device A (Sam answers first) · scenario free-couple-packs
# MOB-49: a started pack question uses the answer flow. Free couple, premium pack "gratitude": its first
# question is free (D43). 33 "Start" opens 19 for that couple_questions row (not 30). Sam answers; with
# Maya not answered yet, 19 hands over to 30, which shows the waiting state and NO answer text, not even
# Sam's own (D13, GAPS 30). When Maya answers on the other phone, 30 moves to the hold (20) by itself
# (realtime on answers); Sam holds and sees both answers on 21.
# Params: ANSWER_A (Sam's text, typed here), ANSWER_B (Maya's text, typed on B), PARTNER_TIMEOUT_MS.
# Pairs: qa/e2e/run-daily.ts pack
appId: app.bonded.mobile
name: Pack question · first to answer, waits on 30, reveals (32, 33, 19, 30, 20, 21)
tags:
  - daily
  - packs
  - two-device
  - device-a
  - reveal-rule
---
- runFlow:
    file: ../subflows/sign-in-persona.yaml
    env:
      EMAIL: sam@bonded.test
- extendedWaitUntil:
    visible:
      id: tab-packs
    timeout: 20000
- tapOn:
    id: tab-packs
- extendedWaitUntil:
    visible:
      id: 32-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 32-pack-gratitude
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 32-pack-gratitude
- extendedWaitUntil:
    visible:
      id: 33-start-free
    timeout: 15000
- tapOn:
    id: 33-start-free
# MOB-49: straight to 19 for the pack question (it used to open 30 read-only).
- extendedWaitUntil:
    visible:
      id: 19-screen
    timeout: 15000
- assertVisible:
    id: 19-private
- assertNotVisible:
    id: 19-partner-answered
- tapOn:
    id: 19-field
- inputText: ${ANSWER_A}
- runFlow: ../subflows/hide-keyboard.yaml
- tapOn:
    id: 19-submit
# Partner hasn't answered: 30 waiting (no deadline on a pack question, so not "missed").
- extendedWaitUntil:
    visible:
      id: 30-partner-waiting
    timeout: 15000
- assertNotVisible:
    id: 30-partner-missed
# D13: before the hold 30 shows no answer card and no answer text, not even mine.
- assertNotVisible:
    id: 30-mine
- assertNotVisible:
    id: 30-partner
- assertNotVisible:
    text: ${ANSWER_A}
# Maya answers on the other phone; 30 hands over to the hold by itself.
- extendedWaitUntil:
    visible:
      id: 20-sealed
    timeout: "${typeof PARTNER_TIMEOUT_MS !== 'undefined' ? Number(PARTNER_TIMEOUT_MS) : 180000}"
- assertNotVisible:
    text: ${ANSWER_B}
- runFlow: ../subflows/hold-to-reveal.yaml
- extendedWaitUntil:
    visible:
      id: 21-partner
    timeout: 15000
- assertVisible:
    id: 21-mine
- assertVisible:
    text: ${ANSWER_B}
- assertVisible:
    text: ${ANSWER_A}
