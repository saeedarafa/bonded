# QA-12, QA-34, QA-38 · screens 01, 05, 07, 02, 03, 04, 06, T1, N, L, P2, 08, 10, 11, 23 · one device
# · scenario fresh-install (no auth user for noor). A brand-new person goes through the quiz, story
# and plan in the D50 order (MOB-60, MOB-61): 01 -> 05 stage (1/4) -> 07 names (2/4) -> 02 story
# (the stage's version) -> 03 last learned (3/4) -> 04 how it works -> 06 goals (4/4) -> T1
# answers the day-1 question on the phone (MOB-69, D50 (7): 47 Key dates left onboarding, dates
# come only from Us) -> N daily moment
# ("Not now": deterministic, no OS prompt) -> L builds the plan by itself (~4 s) -> P2 "Start our
# plan" -> [P3 soft paywall, MOB-62: only with a RevenueCat key] -> 08 sign-up with an email code. SetupBond writes
# the couple (create_couple), the ritual time and the T1 answer; 09 no longer shows (N already
# answered the soft ask), so 10 Invite comes straight after setup. "Later" -> 11 -> Today: day 1 is
# already answered, so Today is in the waiting state (23), not the answer CTA (18).
# Run: qa/e2e/run-onboarding.ts fresh (checks noor's solo couple, stage + goals, no key dates, the
# T1 answer on day 1 and ritual_time 21:00 in the database).
appId: com.hellobonded.app
name: Onboarding · fresh install to Today waiting (06 -> T1, T1 answered, N declined)
tags:
  - onboarding
  - single-device
  - mob-28
env:
  EMAIL: "${typeof EMAIL !== 'undefined' ? EMAIL : 'noor@bonded.test'}"
  ANSWER: "${typeof ANSWER !== 'undefined' ? ANSWER : 'FIXTURE-T1 noor day one'}"
---
- runFlow: ../subflows/launch-signed-out.yaml
- tapOn:
    id: 01-start
# 05 Stage (1/4).
- extendedWaitUntil:
    visible:
      id: 05-dating
    timeout: 10000
- tapOn:
    id: 05-dating
- tapOn:
    id: 05-next
# 07 Names (2/4).
- tapOn:
    id: 07-me
- inputText: Noor
- tapOn:
    id: 07-partner
- inputText: Ari
- runFlow: ../subflows/hide-keyboard.yaml
- tapOn:
    id: 07-next
# 02 Story: the dating version (picked on 05).
- extendedWaitUntil:
    visible:
      id: 02-dating
    timeout: 10000
- tapOn:
    id: 02-next
# 03 Last learned (3/4).
- tapOn:
    id: 03-this_week
- tapOn:
    id: 03-next
# 04 How it works (payoff cards).
- extendedWaitUntil:
    visible:
      id: 04-partner-card
    timeout: 10000
- tapOn:
    id: 04-next
# 06 Goals (4/4).
- tapOn:
    id: 06-deep_talks
- tapOn:
    id: 06-next
# T1 Try it, straight after 06 (MOB-69: no 47 Key dates in onboarding): answer the day-1 question
# on the phone (kept encrypted until sign-in).
- extendedWaitUntil:
    visible:
      id: T1-field
    timeout: 10000
- assertNotVisible:
    id: 47-skip
- tapOn:
    id: T1-field
- inputText: ${ANSWER}
- runFlow: ../subflows/hide-keyboard.yaml
- tapOn:
    id: T1-submit
# N Your daily moment: keep 21:00 (pre-picked) and decline reminders ("Not now").
- extendedWaitUntil:
    visible:
      id: N-decline
    timeout: 10000
- assertVisible:
    id: N-time-evening
- tapOn:
    id: N-decline
# L Building your plan runs by itself (~4 s) and replaces itself with P2.
- extendedWaitUntil:
    visible:
      id: P2-screen
    timeout: 15000
- assertNotVisible:
    id: L-screen
- tapOn:
    id: P2-start
# P3 soft trial paywall (MOB-62). Only with a RevenueCat key and a live offering: then x opens,
# once, either the D57 exit offer sheet (MOB-76: `exit30` live and the store account intro-eligible;
# "No thanks, continue free") or the 17 exit sheet ("Continue with free"); both go on to 08.
# D61 (QA-52) retired the exit sheet on ×: offers/close-p3-no-offer.yaml checks it never shows; the
# optional branch below only keeps builds before MOB-84 passing. Without a key (local/CI builds) P3
# replaces itself with 08, so the whole step is optional. No purchase is made here.
- extendedWaitUntil:
    visible:
      id: P3-buy
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: P3-close
    commands:
      - tapOn:
          id: P3-close
      - extendedWaitUntil:
          visible:
            id: exit-offer-sheet
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible:
              id: exit-offer-no
          commands:
            - tapOn:
                id: exit-offer-no
      - runFlow:
          when:
            visible:
              id: 17-leave
          commands:
            - tapOn:
                id: 17-leave
# 08 Save your bond: no quiz progress since D50 (the quiz ends at 06, 4/4).
- extendedWaitUntil:
    visible:
      id: 08-screen
    timeout: 10000
- assertNotVisible:
    id: 08-progress
- runFlow:
    file: ../subflows/sign-in-email.yaml
    env:
      SCREEN: '08'
      EMAIL: ${EMAIL}
# 09 steps aside (N answered the soft ask on this device): 10 Invite straight after setup.
- extendedWaitUntil:
    visible:
      id: 10-screen
    timeout: 30000
- assertNotVisible:
    id: setup-error
- assertNotVisible:
    id: 09-decline
# Later -> 11 Waiting -> Today: day 1 already has my T1 answer, so Today waits for the partner.
- tapOn:
    id: 10-later
- extendedWaitUntil:
    visible:
      id: 11-answer
    timeout: 10000
- tapOn:
    id: 11-answer
- extendedWaitUntil:
    visible:
      id: 23-screen
    timeout: 15000
- assertNotVisible:
    id: 18-answer
