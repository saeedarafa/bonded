# QA-12 · D02 (BE-26 / MOB-32), inviter side: the typed-code join request shows on 10, 11 or the Today
# card, naming who asks; the inviter approves it with one tap. Then the joiner moves on and this phone
# goes to 13 (wait-for-partner.yaml).
# Param INVITER_SCREEN: where the inviter waits (10 | 11 | today; default 11).
appId: app.bonded.mobile
env:
  INVITER_SCREEN: '11'
---
- extendedWaitUntil:
    visible:
      id: ${INVITER_SCREEN}-join-request
    timeout: 120000
- assertVisible:
    id: ${INVITER_SCREEN}-join-request-title
- tapOn:
    id: ${INVITER_SCREEN}-join-request-approve
