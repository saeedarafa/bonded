# QA-04: a persona who already has an account signs in through 08 and lands on Today (couple exists).
# There is no "I already have an account" entry on 01, so the flow opens 08 by deep link.
# Params: EMAIL, NOTIFICATIONS (optional, see launch-signed-out.yaml).
appId: app.bonded.mobile
---
- runFlow:
    file: launch-signed-out.yaml
    env:
      NOTIFICATIONS: "${typeof NOTIFICATIONS !== 'undefined' ? NOTIFICATIONS : 'allow'}"
- runFlow:
    file: open-link.yaml
    env:
      LINK: bonded://sign-in
- runFlow:
    file: sign-in-email.yaml
    env:
      SCREEN: '08'
      EMAIL: ${EMAIL}
- extendedWaitUntil:
    notVisible:
      id: 08-screen
    timeout: 15000
