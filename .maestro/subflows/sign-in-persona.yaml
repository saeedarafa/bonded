# QA-04: a persona who already has an account signs in through 08 and lands on Today (couple exists).
# It opens 08 by deep link on purpose, not by 01 "I already have an account": that sets D40's returning
# flag, and a solo persona would land on 10 instead of Today (auth/returning-sign-in.yaml covers D40).
# Params: EMAIL.
appId: app.bonded.mobile
---
- runFlow: launch-signed-out.yaml
- runFlow:
    file: open-link.yaml
    env:
      LINK: bonded://sign-in
- runFlow:
    file: sign-in-email.yaml
    env:
      SCREEN: '08'
      EMAIL: ${EMAIL}
- extendedWaitUntil:
    notVisible:
      id: 08-screen
    timeout: 15000
