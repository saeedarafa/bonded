# QA-11b: type EMAIL into the email field of 08 / J4 (SignInView) and check the field holds exactly that
# address before anyone taps "Send code". Maestro's iOS typing sometimes drops trailing characters (QA-11
# run 1 sent the mail to maya@bonded.te); then the field is cleared and the address typed again.
# Params: SCREEN (08 | J4), EMAIL.
appId: com.trybonded.app
---
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: ${SCREEN}-email-field
      - eraseText: 60
      - inputText: ${EMAIL}
      - assertVisible:
          id: ${SCREEN}-email-field
          text: ${EMAIL}
- runFlow: hide-keyboard.yaml
