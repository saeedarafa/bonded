# QA-04: email-code sign-in on 08 or J4 (SignInView). The code comes from the local mail catcher.
# Params: SCREEN (08 | J4), EMAIL (a persona from qa/fixtures/personas.json), MAILPIT_URL (optional).
# The run script empties the mail catcher before each flow, so the newest mail is ours.
appId: app.bonded.mobile
---
- extendedWaitUntil:
    visible:
      id: ${SCREEN}-screen
    timeout: 15000
- tapOn:
    id: ${SCREEN}-email
- tapOn:
    id: ${SCREEN}-email-field
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    id: ${SCREEN}-send-code
- extendedWaitUntil:
    visible:
      id: ${SCREEN}-code-field
    timeout: 15000
- retry:
    maxRetries: 5
    commands:
      - runScript:
          file: ../scripts/fetch-otp.js
          env:
            EMAIL: ${EMAIL}
            MAILPIT_URL: "${typeof MAILPIT_URL !== 'undefined' ? MAILPIT_URL : 'http://127.0.0.1:54324'}"
- tapOn:
    id: ${SCREEN}-code-field
- inputText: ${output.otp}
- hideKeyboard
- tapOn:
    id: ${SCREEN}-verify
