# QA-04 / QA-11: email-code sign-in on 08 or J4 (SignInView). The 6-digit code is read from the sign-in
# email in the local mail catcher only (D35); no admin generate_link fallback.
# Params: SCREEN (08 | J4), EMAIL (a persona from qa/fixtures/personas.json), MAILPIT_URL (optional).
# The run script empties the mail catcher before each flow, so the newest mail is ours.
# QA-11b: the address is typed through type-email.yaml, which checks the field before sending (iOS typing
# sometimes dropped the last characters and the mail went to a wrong address).
appId: app.bonded.mobile
---
- extendedWaitUntil:
    visible:
      id: ${SCREEN}-screen
    timeout: 15000
- tapOn:
    id: ${SCREEN}-email
- runFlow:
    file: type-email.yaml
    env:
      SCREEN: ${SCREEN}
      EMAIL: ${EMAIL}
- tapOn:
    id: ${SCREEN}-send-code
- extendedWaitUntil:
    visible:
      id: ${SCREEN}-code-field
    timeout: 15000
- retry:
    maxRetries: 5
    commands:
      - runScript:
          file: ../scripts/mail-otp.js
          env:
            EMAIL: ${EMAIL}
            MAILPIT_URL: "${typeof MAILPIT_URL !== 'undefined' ? MAILPIT_URL : 'http://127.0.0.1:54324'}"
- tapOn:
    id: ${SCREEN}-code-field
- inputText: ${output.otp}
- runFlow: hide-keyboard.yaml # on iOS its "Done" already submits the code
- tapOn:
    id: ${SCREEN}-verify
    optional: true # gone when "Done" signed in already; Android taps it
