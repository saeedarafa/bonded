# QA-31 (MOB-23): close the monthly check-in sheet (26) if Today opened it. It shows at most once
# per 30 days per person on a phone, on Today after that phone saw today's reveal, from day 30
# together (history-month, delete-account). Run it after returning to Today on such a couple; it
# does nothing when the sheet is not there. Skip sends no score.
appId: com.hellobonded.app
---
- runFlow:
    when:
      visible:
        id: 26-sheet
    commands:
      - tapOn:
          id: 26-skip
      - extendedWaitUntil:
          notVisible:
            id: 26-sheet
          timeout: 5000
