# QA-12 · D02 (BE-26 / MOB-32), joiner side. A typed code (no valid link token) makes a PENDING join
# request: the joiner sees "Waiting for <name> to confirm" (/join/pending) and moves on only after the
# inviter approves on 10 / 11 / Today (inviter-approve.yaml on the other phone). From J5 (signed out,
# J3 -> J4 -> J5) the next stop is J6 reminders (declined here), then 13; from 12 (signed in) it is 13.
# Link-with-token joins are NOT routed through here: they still pair at once.
appId: com.trybonded.app
---
- extendedWaitUntil:
    visible:
      id: 12-join-pending-waiting
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: 12-join-pending-waiting
    timeout: 150000
- repeat:
    while:
      notVisible:
        id: 13-screen
    times: 10
    commands:
      - runFlow:
          when:
            visible:
              id: J6-decline
          commands:
            - tapOn:
                id: J6-decline
      - extendedWaitUntil:
          visible:
            id: 13-screen
          timeout: 3000
          optional: true
- assertVisible:
    id: 13-screen
- tapOn:
    id: 13-continue
