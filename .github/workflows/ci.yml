# Bonded CI (QA-01). Runs on every PR and every push to main.
#
# Job names are stable: the lead marks them required on main. "ci-ok" aggregates all of
# them, so requiring that one check is enough; new jobs only need adding to its "needs".
#
# Jobs whose target hasn't landed yet (app: MOB-01, db-tests/db-reset: BE-01, functions: BE-23)
# report a "skipped" notice and pass, then turn on by themselves when the code merges.
# The logic lives in qa/ci/*.sh so it can be run locally: bash qa/ci/<job>.sh
#
# No path filters on purpose: a required check that doesn't run blocks the PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_NODE_VERSION: '24'

jobs:
  plan-check:
    name: plan-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.DEFAULT_NODE_VERSION }}
      - name: SCOPE.md and BACKLOG views match scope-map.json
        run: node scripts/plan/generate.mjs --check

  agents-sync-check:
    name: agents-sync-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.DEFAULT_NODE_VERSION }}
      - name: .claude/ and .agents/ copies match .github/
        run: node scripts/agents/sync.mjs --check

  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Node version (.nvmrc if present)
        id: node
        run: echo "version=$(cat .nvmrc 2>/dev/null || echo "$DEFAULT_NODE_VERSION")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-db-${{ runner.os }}-${{ hashFiles('supabase/tests/package-lock.json') }}
          restore-keys: npm-db-${{ runner.os }}-
      - name: RLS and RPC tests (PGlite) + generated types check
        run: bash qa/ci/db-tests.sh

  # Real Supabase Postgres (config.toml major_version, 17) via the CLI and Docker:
  # checks that supabase/migrations apply with `supabase db reset`. ubuntu-latest has Docker.
  db-reset:
    name: db-reset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        if: hashFiles('supabase/config.toml') != ''
        with:
          version: 3.0.0
      # QA-06: the purchase contract tests run the real revenuecat/notify handlers under Deno.
      - uses: denoland/setup-deno@v2
        if: hashFiles('qa/functions/purchase_harness.ts') != ''
        with:
          deno-version: v2.x
      - name: supabase start + db reset
        run: bash qa/ci/db-reset.sh

  functions:
    name: functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        if: hashFiles('supabase/functions/**/*.ts') != ''
        with:
          deno-version: v2.x
      # QA-42 Deno imports: every remote import in supabase/functions is version-pinned in the
      # specifier (npm:@supabase/supabase-js@2.57.4 exact; jsr:@std/assert@1, test-only) and
      # resolved through supabase/functions/deno.lock (committed; deno.json has no import map).
      # deno check/test below use that lock, so a changed remote package fails the integrity check.
      # Dependabot does not scan Deno: bump the pin by hand (backend) and commit the new lock.
      # Rule: no unpinned or URL (esm.sh, cdn) imports in functions code.
      - name: deno lint, check, test
        run: bash qa/ci/functions.sh

  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Node version (.nvmrc if present)
        id: node
        run: echo "version=$(cat .nvmrc 2>/dev/null || echo "$DEFAULT_NODE_VERSION")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-app-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-app-${{ runner.os }}-
      # QA-42: fail on high/critical advisories in the app's production dependencies (the
      # shipped bundle). Dev-only tooling (Jest, ESLint) and moderate/low findings are left to the
      # weekly Dependabot PRs (.github/dependabot.yml). Reads package-lock.json only, no install.
      - name: npm audit (prod deps, high+)
        if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high --omit=dev
      - name: typecheck, lint, Jest
        run: bash qa/ci/app.sh

  # Secret scan of the commits this PR (or push) adds, not the whole history (QA-43).
  # fetch-depth 0 so the base..head range exists; the repo is small (about 25 MB).
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (PR commits only, values redacted)
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash qa/ci/gitleaks.sh

  # Semgrep CE, OSS rules + qa/semgrep (QA-44), on the files this PR changes only.
  # ERROR findings fail; WARNING findings are annotated. Pushes to main skip it.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: semgrep (changed files)
        if: github.event_name == 'pull_request'
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash qa/ci/semgrep.sh

  web:
    name: web
    # QA-47: Playwright layout check of web/ on Android, iPhone, iPad and desktop profiles.
    # Skips in seconds unless web/, qa/web/, qa/ci/web.sh or this file changed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.DEFAULT_NODE_VERSION }}
      - name: web (Playwright, when the site changes)
        env:
          SCAN_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || '--all' }}
          SCAN_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash qa/ci/web.sh
      - name: Upload screenshots and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report
          path: |
            qa/web/playwright-report/
            qa/web/test-results/
          retention-days: 14

  ci-ok:
    name: ci-ok
    if: always()
    needs: [plan-check, agents-sync-check, db-tests, db-reset, functions, app, gitleaks, semgrep, web]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::at least one CI job failed or was cancelled"
            exit 1
          fi
