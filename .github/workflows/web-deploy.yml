# LEAD-04: deploy the static site in web/ to Cloudflare Pages (PO 2026-11-12).
# No Cloudflare Git integration: Cloudflare gets no repo access. The token is Pages:Edit only.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (docs/plan/ACCOUNTS.md item 11).
name: web-deploy

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: hellobonded
  WRANGLER_VERSION: '4'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Create the Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@"$WRANGLER_VERSION" pages project list | grep -qw "$PAGES_PROJECT"; then
            echo "Pages project $PAGES_PROJECT exists"
          else
            npx --yes wrangler@"$WRANGLER_VERSION" pages project create "$PAGES_PROJECT" --production-branch main
          fi
      - name: Inject the public PostHog key (ANALYTICS §5)
        # Repo variable (not a secret): PostHog's public phc_ client key, same project as the app.
        # Empty or malformed = the site ships without analytics (analytics.js stays a no-op).
        env:
          POSTHOG_PUBLIC_KEY: ${{ vars.POSTHOG_PUBLIC_KEY }}
        run: |
          if [[ "$POSTHOG_PUBLIC_KEY" =~ ^phc_[A-Za-z0-9]{20,80}$ ]]; then
            sed -i "s/__POSTHOG_PUBLIC_KEY__/${POSTHOG_PUBLIC_KEY}/" web/assets/analytics.js
            grep -q "__POSTHOG_PUBLIC_KEY__" web/assets/analytics.js && { echo "::error::key not injected"; exit 1; } || echo "PostHog key injected"
          else
            echo "::warning::POSTHOG_PUBLIC_KEY repo variable missing or malformed: deploying without website analytics"
          fi
      - name: Deploy web/
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@"$WRANGLER_VERSION" pages deploy web --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
